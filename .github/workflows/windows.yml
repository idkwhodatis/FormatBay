name: Windows conversions and Electron smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formatbay-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundled-ffmpeg:
    name: Build source-complete LGPL FFmpeg for Windows
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trusted distribution cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 make nasm pkg-config curl xz-utils
      - name: Build pinned official sources and retain corresponding source
        env:
          CROSS_PREFIX: x86_64-w64-mingw32-
          JOBS: '4'
        run: bash scripts/build-bundled-ffmpeg.sh "$RUNNER_TEMP/formatbay-ffmpeg"
      - name: Upload complete binary, source and license bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-windows-x64-source-complete
          path: ${{ runner.temp }}/formatbay-ffmpeg/
          if-no-files-found: error
          retention-days: 14
  windows:
    name: Windows real tools, paths and production Electron
    needs: bundled-ffmpeg
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'
      - name: Install pinned optional opusenc test tool
        run: ./scripts/install-windows-tools.ps1
      - name: Download same-run source-complete FFmpeg build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-windows-x64-source-complete
          path: ${{ runner.temp }}/formatbay-ffmpeg
      - name: Use self-built FFmpeg for every native conversion test
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'formatbay-ffmpeg'
          "FORMATBAY_FFMPEG_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $bundle 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked dependencies and official Electron binary
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location src/frontend
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Verify syntax, locale keys and required media capabilities
        run: |
          node scripts/check.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-tools.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native processes, paths and real conversions without skips
        timeout-minutes: 5
        run: |
          node --test --test-timeout=180000 --test-reporter=tap | Tee-Object -FilePath test-results.tap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path test-results.tap -Pattern '^# skipped 0$' -Quiet)) {
            throw 'Integration tests must not be skipped'
          }
      - name: Produce and verify every fixed output with the bundled FFmpeg
        timeout-minutes: 6
        run: node scripts/bundled-ffmpeg-smoke.mjs
      - name: Build production renderer
        run: |
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise production Electron UI, IPC and real conversions
        run: |
          node scripts/electron-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned Windows portable preview
        run: |
          bun run package:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Accept bundled tools and real explicit optional-tool installation in packaged executable
        timeout-minutes: 10
        run: |
          node scripts/packaged-smoke.mjs release/FormatBay-win32-x64/FormatBay.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify lockfiles and source remain unchanged
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload tested unsigned portable preview with source and notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FormatBay-Windows-x64-unsigned-preview
          path: release/FormatBay-win32-x64/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
