name: Linux conversion tests and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formatbay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conversion:
    name: Real media tools, tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Build/tests do not claim native Electron GUI coverage or need its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Install real media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg opus-tools
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          (cd src/frontend && bun install --frozen-lockfile)
      - name: Verify syntax, locale keys and required tool capabilities
        run: |
          bun run check
          bun run check:tools
      - name: Test real conversions without skipped integrations
        run: |
          node --test --test-reporter=tap | tee test-results.tap
          grep -q '^# skipped 0$' test-results.tap
      - name: Build renderer
        run: bun run build
      - name: Verify lockfiles and source remain unchanged
        run: git diff --exit-code
